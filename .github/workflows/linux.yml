name: Linux allocator checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      matrix:
        compiler: [g++, clang++]
        flags: ['-O2 -g', '-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined']
    env:
      CXX: ${{ matrix.compiler }}
      CXXFLAGS: ${{ matrix.flags }}
      UBSAN_OPTIONS: halt_on_error=1
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - run: make -j2 test
